<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clearcut Banner</title>
<!-- Release banner. Render at 1920×1080 with: scripts/render-banner.ps1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Lexend+Zetta:wght@200&family=Lexend+Exa:wght@400&family=Outfit:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #0b0b0a;
    --lime: #c8f135;
    --lime-pale: #e4f7a8;
    --lime-deep: #4d6a00;
    --white: #f6f6f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
  body { position: relative; font-family: "Outfit", sans-serif; color: var(--white); }

  /* Soft colour fields */
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .g1 { width: 900px; height: 700px; left: 1050px; top: 420px; background: #3f5410; opacity: .85; }
  .g2 { width: 520px; height: 520px; left: 1000px; top: -180px; background: #33421a; opacity: .7; }
  .g3 { width: 760px; height: 520px; left: -260px; top: 260px; background: #1f2617; opacity: .9; }
  .g4 { width: 520px; height: 420px; left: 160px; top: 860px; background: #2b3613; opacity: .6; }
  .g5 { width: 420px; height: 420px; left: 1560px; top: 40px; background: #4a6114; opacity: .55; }

  /* Halftone dots, strongest bottom-right */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(220, 245, 140, .34) 1.7px, transparent 2.1px);
    background-size: 14px 14px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 78% 72%, #000 0%, rgba(0,0,0,.35) 55%, transparent 80%),
                        radial-gradient(ellipse 30% 25% at 62% 8%, rgba(0,0,0,.6), transparent 70%);
  }

  h1 {
    position: absolute; left: 92px; top: 52px;
    font-family: "Unbounded", sans-serif; font-weight: 800;
    font-size: 200px; letter-spacing: -2px; line-height: 1;
  }
  .subtitle {
    position: absolute; left: 100px; top: 300px;
    font-family: "Lexend Zetta", sans-serif; font-weight: 200;
    font-size: 84px; letter-spacing: -7px; line-height: 1;
  }

  .highlights { position: absolute; left: 96px; top: 500px; width: 1100px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 14px; }
  .highlights strong { font-weight: 700; font-size: 40px; margin-right: 12px; }
  .pill {
    background: var(--white); color: #111; border-radius: 999px;
    font-size: 32px; font-weight: 500; padding: 12px 28px; line-height: 1.25;
  }
  .pill.more { width: 66px; height: 66px; padding: 0; display: grid; place-items: center; font-size: 34px; }

  .badge { position: absolute; left: 1450px; top: 30px; width: 440px; height: 440px; }
  .badge svg { width: 100%; height: 100%; }

  .version {
    position: absolute; right: 92px; top: 770px;
    font-family: "Unbounded", sans-serif; font-weight: 800;
    font-size: 176px; letter-spacing: 2px; line-height: 1; color: var(--lime-pale);
  }
  .cta {
    position: absolute; right: 92px; top: 962px;
    font-family: "Lexend Exa", sans-serif; font-size: 38px; letter-spacing: -1px;
  }

  .repo {
    position: absolute; left: 76px; top: 934px; height: 92px; padding-right: 40px;
    background: var(--white); border-radius: 999px;
    display: flex; align-items: center; padding-left: 12px; gap: 26px;
  }
  .repo .mini { width: 70px; height: 70px; }
  .repo span {
    font-family: "Lexend Exa", sans-serif; font-size: 37px; letter-spacing: -1.5px;
    color: var(--lime-deep);
  }

  /* Social preview variant (open with ?social): 1920x960, GitHub's 2:1 card ratio. */
  html.social, html.social body { height: 960px; }
  html.social .version { top: 650px; }
  html.social .cta { top: 842px; }
  html.social .repo { top: 814px; }
  html.social .g4 { top: 760px; }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="glow g4"></div><div class="glow g5"></div>
  <div class="dots"></div>

  <h1>Clearcut</h1>
  <div class="subtitle">Background Eraser</div>

  <div class="highlights">
    <strong>Highlights:</strong>
    <span class="pill">One-click AI Cutouts</span>
    <span class="pill">Photo + Anime Models</span>
    <span class="pill">100% Offline</span>
    <span class="pill">Edge-aware Magic Brush</span>
    <span class="pill more">+</span>
  </div>

  <div class="badge">
    <svg viewBox="0 0 440 440" aria-hidden="true">
      <path id="scallop" fill="#e4f7a8"/>
      <rect x="100" y="100" width="240" height="240" rx="58" fill="#141a04"/>
      <g transform="translate(116 116) scale(.8125)">
        <rect x="8" y="8" width="240" height="240" rx="56" fill="#c8f135"/>
        <g fill="none" stroke="#141a04" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
          <path d="M58 92 V58 H92 M164 58 H198 V92 M198 164 V198 H164 M92 198 H58 V164"/>
        </g>
        <circle cx="128" cy="108" r="26" fill="#141a04"/>
        <path d="M82 182 A46 36 0 0 1 174 182 Z" fill="#141a04"/>
      </g>
    </svg>
  </div>

  <div class="version">v1.0.0</div>
  <div class="cta">Download on GitHub →</div>

  <div class="repo">
    <svg class="mini" viewBox="0 0 256 256" aria-hidden="true">
      <rect x="8" y="8" width="240" height="240" rx="56" fill="#c8f135"/>
      <g fill="none" stroke="#141a04" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <path d="M58 92 V58 H92 M164 58 H198 V92 M198 164 V198 H164 M92 198 H58 V164"/>
      </g>
      <circle cx="128" cy="108" r="26" fill="#141a04"/>
      <path d="M82 182 A46 36 0 0 1 174 182 Z" fill="#141a04"/>
    </svg>
    <span>github.com/sharknado55/clearcut</span>
  </div>

  <script>
    if (location.search.includes("social")) document.documentElement.classList.add("social");
    // Wavy "seal" outline: a circle whose radius ripples 12 times around.
    const points = [];
    for (let i = 0; i < 360; i++) {
      const t = (i / 360) * Math.PI * 2, r = 200 + 13 * Math.cos(12 * t);
      points.push(`${(220 + r * Math.sin(t)).toFixed(1)} ${(220 - r * Math.cos(t)).toFixed(1)}`);
    }
    document.getElementById("scallop").setAttribute("d", "M" + points.join(" L") + " Z");
  </script>
</body>
</html>
